global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # Consumer lag, topic offsets, replication state. Read-only Kafka user, see setup-kafka.sh.
  - job_name: kafka-exporter
    static_configs:
      - targets: ["kafka-exporter:9308"]
