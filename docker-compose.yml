# BrewQueue local environment.
#
#   Everything:            docker compose up -d --build
#   Infrastructure only:   docker compose up -d postgres redis rabbitmq kafka seq kafka-ui
#                          (then run the .NET projects and `npm run dev` from your IDE/terminal)
#
# UIs:  web http://localhost:3000 · API docs http://localhost:5080/scalar/v1
#       RabbitMQ http://localhost:15672 (brewqueue/brewqueue) · Kafka UI http://localhost:8081
#       Seq logs http://localhost:5341

name: brewqueue

x-dotnet-env: &dotnet-env
  ASPNETCORE_ENVIRONMENT: Development
  DOTNET_ENVIRONMENT: Development
  ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=brewqueue;Username=brewqueue;Password=brewqueue
  ConnectionStrings__Redis: redis:6379
  RabbitMq__HostName: rabbitmq
  RabbitMq__UserName: brewqueue
  RabbitMq__Password: brewqueue
  Kafka__BootstrapServers: kafka:19092
  Serilog__WriteTo__1__Args__serverUrl: http://seq:5341

services:
  # ---------------------------------------------------------------- infrastructure
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: brewqueue
      POSTGRES_USER: brewqueue
      POSTGRES_PASSWORD: brewqueue
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brewqueue -d brewqueue"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: brewqueue
      RABBITMQ_DEFAULT_PASS: brewqueue
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # management UI
    volumes: [rabbitdata:/var/lib/rabbitmq]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 20

  # Single-node Kafka in KRaft mode (no ZooKeeper).
  # Two listeners: kafka:19092 for containers, localhost:9092 for apps running on your machine.
  kafka:
    image: apache/kafka:4.0.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    ports: ["9092:9092"]
    # No volume: topics and offsets reset when the container is recreated (fine for local dev).
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  kafka-ui:
    image: kafbat/kafka-ui:latest
    environment:
      KAFKA_CLUSTERS_0_NAME: brewqueue
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    ports: ["8081:8080"]
    depends_on:
      kafka: { condition: service_healthy }

  # Structured log viewer. Search e.g. CorrelationId = 'abc' to follow one order across services.
  seq:
    image: datalust/seq:latest
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"
    ports: ["5341:80"] # UI and ingestion on one host port
    volumes: [seqdata:/data]

  # ---------------------------------------------------------------- application
  api:
    build:
      context: .
      dockerfile: src/Dockerfile
      args: { PROJECT: BrewQueue.Api }
    environment:
      <<: *dotnet-env
      Cors__Origins__0: http://localhost:3000
    ports: ["5080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      kafka: { condition: service_healthy }
    healthcheck:
      # The aspnet image has no curl; bash can open a TCP socket instead.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  kitchen:
    build:
      context: .
      dockerfile: src/Dockerfile
      args: { PROJECT: BrewQueue.KitchenWorker }
    environment:
      <<: *dotnet-env
      BrewQueueApi__BaseUrl: http://api:8080/
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
    # Try: docker compose up -d --scale kitchen=3   (RabbitMQ spreads orders across workers)

  stats:
    build:
      context: .
      dockerfile: src/Dockerfile
      args: { PROJECT: BrewQueue.StatsWorker }
    environment:
      <<: *dotnet-env
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

  web:
    build: ./web
    environment:
      NUXT_API_BASE_SERVER: http://api:8080     # used during SSR, inside the Docker network
      NUXT_PUBLIC_API_BASE: http://localhost:5080 # used by your browser
    ports: ["3000:3000"]
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pgdata:
  rabbitdata:
  seqdata:
